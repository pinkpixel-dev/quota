[package]
name = "quota-core"
version = "0.1.0"
description = "Shared AI usage provider logic for Quota."
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/quota"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "5.0"
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
