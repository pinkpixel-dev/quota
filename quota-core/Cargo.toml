[package]
name = "quota-core"
version = "0.1.0"
description = "Shared AI usage provider logic for Quota."
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/quota"
homepage = "https://pinkpixel.dev"
readme = "README.md"
keywords = ["usage", "quota", "claude", "codex", "cli"]
categories = ["api-bindings", "command-line-utilities"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "5.0"
md5 = "0.7"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
urlencoding = "2"
# Reads the Antigravity CLI's token, which it stores in the OS keyring rather
# than in a file. Defaults cover Secret Service on Linux and Credential Manager
# on Windows; macOS needs its own store enabled.
keyring = { version = "4", features = ["apple-native-keyring-store"] }
# Reads the Kiro CLI's token, which it keeps in a SQLite database rather than
# in the SSO cache file its IDE writes. Bundled so the build does not depend on
# a system SQLite being present.
rusqlite = { version = "0.31", features = ["bundled"] }
