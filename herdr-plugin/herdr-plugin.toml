id = "pinkpixel.quota"
name = "Quota"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]
description = "Show Claude 5h and weekly usage in the agents sidebar."

[[actions]]
id = "refresh"
title = "Refresh Quota usage"
command = ["quota-cli", "herdr", "report", "--force"]

[[events]]
on = "pane.agent_status_changed"
command = ["quota-cli", "herdr", "report"]
