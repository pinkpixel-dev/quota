[package]
name = "quota-cli"
version = "0.1.0"
description = "Read AI usage from locally stored agent CLI credentials."
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/quota"
edition = "2021"

[lib]
name = "quota_cli"
path = "src/lib.rs"

[[bin]]
name = "quota-cli"
path = "src/main.rs"

[dependencies]
quota-core = { path = "../quota-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
