name: quota-cli Release

# Tag a CLI release as `quota-cli-v<version>` so it cannot be confused with the
# desktop app's own tags, which live in the same repository.
on:
  push:
    tags:
      - "quota-cli-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./quota-cli -> target

      - name: Test
        run: cargo test --manifest-path quota-cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path quota-cli/Cargo.toml --target ${{ matrix.target }}

      # The archive carries the license because the binary is distributed on its
      # own, detached from the repository that holds it.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="quota-cli-${{ matrix.target }}"
          mkdir "$staging"
          cp "quota-cli/target/${{ matrix.target }}/release/quota-cli" "$staging/"
          cp quota-cli/README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "quota-cli-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "quota-cli/target/${{ matrix.target }}/release/quota-cli.exe" $staging
          Copy-Item quota-cli/README.md, LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quota-cli-${{ matrix.target }}
          path: quota-cli-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach binaries to the release
    # Only a tag push publishes. A manual run builds and leaves the artifacts on
    # the workflow run, which is what you want when testing the build itself.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum quota-cli-*.tar.gz quota-cli-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/quota-cli-*.tar.gz
            artifacts/quota-cli-*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
